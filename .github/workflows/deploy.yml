# Amuj Gallery: publish the site's own code to the host (cPanel, FTP) with one click.
# GitHub > Actions > "Deploy to host" > Run workflow.
#
# The repository holds only this site's own files, laid out like the site root (template, our plugins,
# HikaShop email templates, language overrides, images). They are uploaded over the live site; Joomla,
# HikaShop and the other extensions on the host are never touched. Only files changed since the last
# deploy are sent (the action keeps .ftp-deploy-sync-state.json on the host); a file deleted from the
# repository is deleted on the host only if this workflow uploaded it before.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions), entered by the site owner:
#   FTP_SERVER      ftp.example.com
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the Joomla folder on the host, ending with "/", e.g. public_html/
name: Deploy to host

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be uploaded (nothing is changed on the host)"
        type: boolean
        default: false
      protocol:
        description: "FTP protocol (ftps if the host supports it, else ftp)"
        type: choice
        options: [ftps, ftp]
        default: ftps

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: main

      # Says what is wrong with the address before the upload fails on it; the secret's value is never printed
      - name: Check the FTP address
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          S="$FTP_SERVER"
          case "$S" in
            "") echo "::error::FTP_SERVER is empty"; exit 1 ;;
            *://*) echo "::error::FTP_SERVER must not contain ftp:// or https://"; exit 1 ;;
            */*) echo "::error::FTP_SERVER must not contain /"; exit 1 ;;
            *:*) echo "::error::FTP_SERVER must not contain a port"; exit 1 ;;
            *[[:space:]]*) echo "::error::FTP_SERVER contains a space or a line break"; exit 1 ;;
          esac
          echo "Format is fine"
          if ! getent hosts "$S" > /dev/null; then
            echo "::error::FTP_SERVER does not resolve from GitHub (no DNS answer). Use the server IP from cPanel"
            exit 1
          fi
          echo "DNS is fine"
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$S/21" 2> /dev/null; then
            echo "::error::Port 21 is not reachable from GitHub. The host blocks FTP from abroad or uses another port"
            exit 1
          fi
          echo "Port 21 is reachable"

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ inputs.protocol }}
          dry-run: ${{ inputs.dry_run }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .gitignore
