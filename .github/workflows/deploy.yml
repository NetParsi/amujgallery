# Amuj Gallery: publish the site's own code to the host (cPanel, FTP) with one click.
# GitHub > Actions > "Deploy to host" > Run workflow.
#
# The repository holds only this site's own files, laid out like the site root (template, our plugins,
# HikaShop email templates, language overrides, images). They are uploaded over the live site; Joomla,
# HikaShop and the other extensions on the host are never touched. Every run sends all of these files
# with lftp, one at a time. The host drops the connection during a long upload, so lftp reconnects and
# a retry skips what already arrived. Nothing is deleted on the host: a file removed from the repository
# stays there until it is removed by hand.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions), entered by the site owner:
#   FTP_SERVER      ftp.example.com
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the Joomla folder on the host, ending with "/", e.g. public_html/
name: Deploy to host

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be uploaded (nothing is changed on the host)"
        type: boolean
        default: false
      protocol:
        description: "FTP protocol (ftps if the host supports it, else ftp)"
        type: choice
        options: [ftps, ftp]
        default: ftps

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: main

      # Says what is wrong with the address before the upload fails on it; the secret's value is never printed
      - name: Check the FTP address
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          S="$FTP_SERVER"
          case "$S" in
            "") echo "::error::FTP_SERVER is empty"; exit 1 ;;
            *://*) echo "::error::FTP_SERVER must not contain ftp:// or https://"; exit 1 ;;
            */*) echo "::error::FTP_SERVER must not contain /"; exit 1 ;;
            *:*) echo "::error::FTP_SERVER must not contain a port"; exit 1 ;;
            *[[:space:]]*) echo "::error::FTP_SERVER contains a space or a line break"; exit 1 ;;
          esac
          echo "Format is fine"
          if ! getent hosts "$S" > /dev/null; then
            echo "::error::FTP_SERVER does not resolve from GitHub (no DNS answer). Use the server IP from cPanel"
            exit 1
          fi
          echo "DNS is fine"
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$S/21" 2> /dev/null; then
            echo "::error::Port 21 is not reachable from GitHub. The host blocks FTP from abroad or uses another port"
            exit 1
          fi
          echo "Port 21 is reachable"

      - name: Upload files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          PROTOCOL: ${{ inputs.protocol }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          if [ "$PROTOCOL" = "ftps" ]; then
            TLS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
          else
            TLS="set ftp:ssl-allow false"
          fi
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          # --only-newer: a retry skips files that already arrived; a new run has a fresh checkout, so it sends all
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt"
            if lftp -c "
              $TLS
              set cmd:fail-exit true
              set net:timeout 30
              set net:max-retries 3
              set net:reconnect-interval-base 5
              set net:reconnect-interval-max 30
              open --env-password --user '$FTP_USERNAME' '$FTP_SERVER'
              mirror --reverse --verbose --only-newer --no-perms --parallel=1 $DRY --exclude '(^|/)\.git' . '$FTP_SERVER_DIR'
            "; then
              echo "Upload finished"
              exit 0
            fi
            sleep 20
          done
          echo "::error::The upload did not finish after 6 attempts"
          exit 1
